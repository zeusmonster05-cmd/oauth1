<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABYSSAL // Authorization Complete</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #06070d;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(112, 0, 255, 0.15), transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
    }

    .card {
      background: rgba(13, 14, 24, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(112, 0, 255, 0.2), inset 0 0 15px rgba(139, 92, 246, 0.1);
      position: relative;
      overflow: hidden;
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #a78bfa;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    /* Animated Checkmark Badge */
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.1);
      border: 2px dashed #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .divider {
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, transparent, #8b5cf6, #38bdf8, transparent);
      margin-bottom: 25px;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 25px;
    }

    .status-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: #38bdf8;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .status-desc {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      }
      50% {
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="subtitle">System Authorization</div>
      <h1 class="title">Abyssal Management</h1>
      
      <div class="icon-wrapper">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <div class="divider"></div>

      <div class="status-box">
        <div class="status-title">ACCESS GRANTED // VERIFIED</div>
        <div class="status-desc">Welcome, Operative. Clearance established successfully.</div>
      </div>

      <button class="btn" onclick="window.close()">TERMINATE WINDOW</button>
    </div>
  </div>

</body>
</html>
