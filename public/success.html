<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABYSSAL MANAGEMENT // Secure Authorization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #030307;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(88, 28, 135, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            font-family: 'Inter', sans-serif;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient background floating light shards */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.1));
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(-100px, -50px) scale(0.9); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(139, 92, 246, 0.15);
            text-align: center;
            max-width: 440px;
            width: 90%;
            transform: translateY(20px);
            opacity: 0;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Shining Header Brand Name */
        .brand-container {
            margin-bottom: 25px;
        }

        .brand-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 6px;
            opacity: 0.8;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            position: relative;
            display: inline-block;
            background: linear-gradient(92deg, #fff 20%, #c084fc 50%, #38bdf8 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.4));
        }

        /* Crazy Shining Sweep Effect */
        .brand-title::after {
            content: 'ABYSSAL MANAGEMENT';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            mix-blend-mode: overlay;
            animation: shineSweep 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes shineSweep {
            0% { transform: translateX(-100%); }
            20% { transform: translateX(100%); }
            100% { transform: translateX(100%); }
        }

        /* Pulsating Core Icon */
        .core-icon-wrap {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(168, 85, 247, 0.4);
            animation: spinRing 12s linear infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .core-circle {
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(192, 132, 252, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
            animation: pulseCore 2s ease-in-out infinite alternate;
        }

        @keyframes pulseCore {
            0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
            100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); }
        }

        .checkmark {
            font-size: 24px;
            color: #38bdf8;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
        }

        /* Dynamic Status Messages */
        .status-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 25px;
        }

        #status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: #c084fc;
            margin-bottom: 6px;
        }

        .user-highlight {
            color: #ffffff;
            font-weight: 600;
        }

        .desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;
        }

        /* Futuristic Action Button */
        .btn-action {
            position: relative;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
            filter: brightness(1.1);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        /* Loading Bar Micro-UI */
        .progress-bar-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #38bdf8);
            box-shadow: 0 0 10px #38bdf8;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="card">
        <div class="brand-container">
            <div class="brand-subtitle">System Authorization</div>
            <h1 class="brand-title">Abyssal Management</h1>
        </div>

        <div class="core-icon-wrap">
            <div class="core-ring"></div>
            <div class="core-circle">
                <span class="checkmark" id="core-symbol">⚡</span>
            </div>
        </div>

        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="p-bar"></div>
        </div>

        <div class="status-box">
            <div id="status-text">INITIALIZING SECURE HANDSHAKE...</div>
            <div class="desc" id="desc-text">Synchronizing credentials with Discord mainframes.</div>
        </div>

        <button onclick="window.close();" class="btn-action" id="close-btn" style="display: none;">Terminate Window</button>
    </div>

    <script>
        // Cinematic multi-step loading sequence
        const statusText = document.getElementById('status-text');
        const descText = document.getElementById('desc-text');
        const progressBar = document.getElementById('p-bar');
        const coreSymbol = document.getElementById('core-symbol');
        const closeBtn = document.getElementById('close-btn');

        setTimeout(() => {
            progressBar.style.width = '45%';
            statusText.textContent = 'ESTABLISHING OAUTH TOKEN...';
            descText.textContent = 'Encrypting user session variables into secure memory.';
        }, 400);

        setTimeout(() => {
            progressBar.style.width = '80%';
            statusText.textContent = 'STORING DATABASE NODES...';
            descText.textContent = 'Registering credentials into MongoDB storage clusters.';
        }, 1100);

        setTimeout(() => {
            progressBar.style.width = '100%';
            statusText.textContent = 'ACCESS GRANTED // VERIFIED';
            statusText.style.color = '#38bdf8';
            descText.innerHTML = 'Welcome, <span class="user-highlight" id="user-tag">Operative</span>. Clearance established successfully.';
            coreSymbol.textContent = '✓';
            closeBtn.style.display = 'block';

            // Grab username from query parameter if available
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                document.getElementById('user-tag').textContent = user;
            }
        }, 1800);
    </script>
</body>
</html>
