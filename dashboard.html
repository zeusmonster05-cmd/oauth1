<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBERPULSE // Operative Web Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <!-- Socket.io Client Engine -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #06070d;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(112, 0, 255, 0.15), transparent 70%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
      color: #e2e8f0; font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; padding: 30px;
    }
    
    /* Navigation Bar */
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(139, 92, 246, 0.3); padding-bottom: 20px; margin-bottom: 35px;
    }
    .nav h1 {
      font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .user-profile { display: flex; align-items: center; gap: 15px; }
    .user-badge {
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    }
    .user-badge b { color: #38bdf8; }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5;
      padding: 8px 18px; border-radius: 8px; text-decoration: none; font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; transition: all 0.2s ease;
    }
    .btn-logout:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

    /* Dashboard Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px; }
    
    .card {
      background: rgba(13, 14, 24, 0.85); border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px; padding: 30px; backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(112, 0, 255, 0.15); position: relative; overflow: hidden;
    }
    .card h2 {
      font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #a78bfa; letter-spacing: 2px;
      margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
    }

    /* Stat Box */
    .stat-val {
      font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 800; color: #10b981;
      text-shadow: 0 0 15px rgba(16, 185, 129, 0.3); margin-bottom: 10px;
    }
    .stat-sub { font-size: 0.95rem; color: #94a3b8; }
    .stat-sub b { color: #e2e8f0; }

    /* Form Inputs */
    .form-group { margin-bottom: 18px; }
    label { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: #38bdf8; letter-spacing: 1px; display: block; margin-bottom: 8px; }
    input {
      width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(139, 92, 246, 0.4);
      background: #0d0e18; color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 1rem;
      outline: none; transition: border 0.2s ease;
    }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

    .btn-submit {
      width: 100%; padding: 14px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px;
      color: white; background: linear-gradient(135deg, #7000ff 0%, #38bdf8 100%);
      border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 20px rgba(112, 0, 255, 0.4); transition: transform 0.2s ease;
    }
    .btn-submit:hover { transform: translateY(-2px); opacity: 0.95; }

    /* Progress Tracker */
    .op-status { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
    .progress-container { width: 100%; background: #1e293b; border-radius: 10px; overflow: hidden; height: 22px; position: relative; }
    .progress-bar {
      width: 0%; height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="nav">
    <h1>⚡ CYBERPULSE DASHBOARD</h1>
    <div class="user-profile">
      <div class="user-badge">Operative: <b id="usernameDisplay">Connected</b></div>
      <a href="/logout" class="btn-logout">LOGOUT</a>
    </div>
  </div>

  <!-- Dashboard Grid Layout -->
  <div class="grid">
    
    <!-- Balance Card -->
    <div class="card">
      <h2>💳 ACCOUNT BALANCE</h2>
      <div class="stat-val" id="creditBalance">0 CREDITS</div>
      <div class="stat-sub">Available Database Stock: <b id="stockCount">Scanning...</b></div>
    </div>

    <!-- Web Member Dispatch Form -->
    <div class="card">
      <h2>🚀 QUEUE DISPATCH</h2>
      <form id="orderForm">
        <div class="form-group">
          <label>TARGET SERVER ID</label>
          <input type="text" id="targetGuildId" placeholder="Ex: 1285560083786371085" required />
        </div>
        <div class="form-group">
          <label>MEMBER QUANTITY</label>
          <input type="number" id="quantity" placeholder="Number of accounts" min="1" required />
        </div>
        <button type="submit" class="btn-submit">EXECUTE DISPATCH</button>
      </form>
    </div>

    <!-- WebSocket Live Dispatch Progress Bar -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>📊 LIVE OPERATION TELEMETRY</h2>
      <div class="op-status" id="activeOpStatus">No active member dispatch in queue...</div>
      <div class="progress-container">
        <div class="progress-bar" id="opProgressBar"></div>
      </div>
    </div>

  </div>

  <script>
    // Initialize Socket.io Connection
    const socket = io();

    // Replace with your current user session ID passed from server rendering or API
    const currentUserId = "USER_DISCORD_ID_HERE";
    socket.emit('joinUserRoom', currentUserId);

    // Handle Form Order Submission
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const guildId = document.getElementById('targetGuildId').value;
      const quantity = parseInt(document.getElementById('quantity').value, 10);

      try {
        const response = await fetch('/api/web-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guildId, quantity })
        });

        const data = await response.json();
        if (!response.ok) {
          alert('❌ Dispatch Error: ' + data.error);
        } else {
          document.getElementById('activeOpStatus').innerText = `🚀 Operation Queued: ${data.opId}`;
        }
      } catch (err) {
        alert('❌ Network connection failed.');
      }
    });

    // Real-Time Socket Progress Events
    socket.on('opProgress', (data) => {
      const percentage = (data.current / data.total) * 100;
      document.getElementById('activeOpStatus').innerHTML = `🚀 Dispatching Operation: <b>${data.opId}</b> (${data.current}/${data.total})`;
      document.getElementById('opProgressBar').style.width = percentage + '%';
    });

    socket.on('opComplete', (data) => {
      document.getElementById('activeOpStatus').innerHTML = `✅ Operation <b>${data.opId}</b> Completed! Successfully added ${data.successful} members.`;
      document.getElementById('opProgressBar').style.width = '100%';
      setTimeout(() => location.reload(), 2500);
    });
  </script>
</body>
</html>
